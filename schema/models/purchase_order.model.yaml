# =============================================================================
# Domain: Buying
# Entity: PurchaseOrder (+ PurchaseOrderItem)
# Description: The supply commitment. Drives inventory's Purchase Receipt (asset
# post) via a ReceiptExpected request and billing's Purchase Invoice (A/P post) —
# buying itself emits NO AccountingPost. 3-way-match watermarks received_qty /
# billed_qty gate completion. Subcontracting is a subtype (order_kind=subcontract).
# supplier/item/company/branch/warehouse are logical FKs.
# =============================================================================

models:
  - name: PurchaseOrder
    collection: purchase_orders
    description: "Supply commitment to a supplier (procure-to-pay); drives receipt + billing via events"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique purchase-order identifier"

      po_number:
        type: string
        attributes: ["@required", "@max(40)"]
        description: "Human reference (e.g. PO-2026-00042)"

      supplier_quotation_id:
        type: uuid?
        attributes: ["@foreign_key(SupplierQuotation.id)"]
        description: "Source supplier quotation (intra-module link; null for direct POs)"

      order_kind:
        type: OrderKind
        attributes: ["@default(standard)"]
        description: "Standard PO or subcontract (a PO whose lines are service + supplied-material BOM)"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Books owner # logical FK to organization.Company.id"

      branch_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Issuing branch # logical FK to organization.Branch.id"

      supplier_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Supplier # logical FK to party.Party.id"

      status:
        type: PurchaseOrderStatus
        attributes: ["@default(draft)"]
        description: "Lifecycle status — a 5-state band (draft/sent/to_approve/purchase/cancelled); delivery/billing maturity is NOT encoded here (see receipt_status / invoice_status)"

      receipt_status:
        type: PurchaseReceiptStatus
        attributes: ["@default(pending)", "@exclude_from_dto"]
        description: "Delivery maturity — STORED COMPUTE owned by the stock bridge (recomputed from the line watermarks after every receipt/return); never hand-set (excluded from all write DTOs; Response-only)"

      invoice_status:
        type: PurchaseInvoiceStatus
        attributes: ["@default(no)", "@exclude_from_dto"]
        description: "Billing maturity — PURE STORED COMPUTE from the billed watermarks (recomputed after every bill/credit); never hand-set (excluded from all write DTOs; Response-only)"

      order_date:
        type: date
        attributes: ["@required"]
        description: "Date the order is placed"

      schedule_date:
        type: date?
        description: "Requested/expected receipt date"

      currency:
        type: string
        attributes: ["@default(\"IDR\")", "@max(3)"]
        description: "ISO currency code"

      currency_rate:
        type: decimal
        attributes: ["@default(1)", "@precision(18,6)", "@positive"]
        description: "Order-time exchange-rate snapshot. CONVENTION (pinned): units of COMPANY currency per 1 unit of PO currency at order_date. Same-currency POs fix 1; a foreign-currency PO without a rate is refused loudly (currency_rate_required) — a silent rate-1 default would mis-classify every foreign-currency PO at the double-validation threshold"

      acknowledged:
        type: bool
        attributes: ["@default(false)"]
        description: "Receipt acknowledgement flag — true once the PO has been acknowledged (manually via the acknowledge verb, or automatically by a recorded receipt); suppresses the receipt-reminder cron"

      locked:
        type: bool
        attributes: ["@default(false)"]
        description: "Order lock — when true, cancel is refused (po_cancel_locked). Orthogonal to the lifecycle band; flips only via the lock/unlock verbs"

      date_approve:
        type: date?
        description: "Date the order entered `purchase` (stamped on confirm-with-gate-pass or approve); NOT cleared by a reset back to draft — it records that the approval happened"

      agreement_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Blanket call-off source # logical FK to buying.PurchaseAgreement.id"

      project_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Project this order buys for # logical FK to project.Project.id. Part of the PO grouping key: two demands with different project_ids NEVER coalesce into one purchase order (the grouping domain resolves candidates through find_open_po_for_demand, whose lookup key matches project_id exactly — NULL matches NULL only)"

      subtotal:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Sum of line amounts before tax"

      tax_rate:
        type: decimal
        attributes: ["@default(0)", "@precision(9,4)", "@non_negative"]
        description: "Supplied PPN Input rate % (real tax from backbone-tax at invoice time)"

      tax_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Tax on subtotal"

      total:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Grand total (subtotal + tax_amount)"

      notes:
        type: string?
        attributes: ["@max(1000)"]
        description: "Free-text terms/notes"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      items:
        type: PurchaseOrderItem[]
        attributes: ["@one_to_many"]
        description: "Line items"
        inverse: order

    indexes:
      - type: unique
        fields: [po_number]
        where: "deleted_at IS NULL"
      - type: index
        fields: [company_id, supplier_id, status]
      - type: index
        fields: [company_id, supplier_id, project_id]
      - type: index
        fields: [order_date]

  - name: PurchaseOrderItem
    collection: purchase_order_items
    description: "One line of a purchase order (with 3-way-match watermarks)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique line identifier"

      order_id:
        type: uuid
        attributes: ["@required", "@foreign_key(PurchaseOrder.id)"]
        description: "Owning purchase order"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Owning company (denormalized from PurchaseOrder for ADR-0010 direct RLS) # logical FK to organization.Company.id"

      item_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Catalog item # logical FK to catalog.Item.id"

      warehouse_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Receipt target warehouse # logical FK to inventory.Warehouse.id"

      description:
        type: string?
        attributes: ["@max(300)"]
        description: "Line description snapshot"

      quantity:
        type: decimal
        attributes: ["@required", "@precision(18,4)", "@non_negative"]
        description: "Quantity ordered"

      rate:
        type: decimal
        attributes: ["@required", "@precision(18,2)", "@non_negative"]
        description: "Unit price"

      line_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "quantity * rate (computed by write path)"

      received_qty:
        type: decimal
        attributes: ["@default(0)", "@precision(18,4)", "@non_negative"]
        description: "Cumulative quantity received (advanced on inventory's PurchaseReceiptSubmitted)"

      billed_qty:
        type: decimal
        attributes: ["@default(0)", "@precision(18,4)", "@non_negative"]
        description: "Cumulative quantity invoiced (advanced on billing's PurchaseInvoicePosted)"

      qty_received_method:
        type: QtyReceivedMethod
        attributes: ["@default(stock_moves)"]
        description: "How received_qty advances on this line: `stock_moves` (the receipt seam allocates it — the default) or `manual` (an operator sets it via set_manual_line_receipt; the seam allocation SKIPS these lines). No method-switch verb: switching after receipts exist would corrupt the watermarks"

      purchase_method:
        type: PurchaseMethod
        attributes: ["@default(on_received)"]
        description: "Billing capacity formula: `on_received` (billed_qty caps at received_qty — invoice ≤ receipt, the goods default) or `purchase` (billed_qty caps at quantity — order-driven service lines may bill ahead of receipt)"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      order:
        type: PurchaseOrder
        attributes: ["@one", "@foreign_key(order_id)"]
        description: "Owning purchase order"
        inverse: items

    indexes:
      - type: index
        fields: [order_id]

# =============================================================================
# Enums (shared across buying documents)
# =============================================================================

enums:
  # The 5-state lifecycle band. Delivery/billing maturity is NOT encoded in status — it lives on the
  # stored computes receipt_status / invoice_status (recomputed from the line watermarks). Legacy
  # mapping at the band migration: watermark states collapse into `purchase`; legacy `closed` maps
  # to `cancelled` as the least-wrong legacy remap.
  - name: PurchaseOrderStatus
    description: "Purchase-order lifecycle band: draft → sent → (gate) purchase | to_approve → purchase; cancelled from any live state; reset returns to draft"
    variants:
      - name: draft
        description: "Being prepared"
        default: true
      - name: sent
        description: "Issued to the supplier (print/send); still editable in the draft sense"
      - name: to_approve
        description: "Confirm parked by the double-validation gate (over-threshold PO without a manager claim)"
      - name: purchase
        description: "Confirmed supply commitment (the operational state — receipt + billing proceed)"
      - name: cancelled
        description: "Voided"

  - name: PurchaseReceiptStatus
    description: "Delivery maturity (stored compute from the line received watermarks — describes delivery, not lifecycle)"
    variants:
      - name: pending
        description: "Nothing received yet"
        default: true
      - name: partial
        description: "Some but not all lines fully received"
      - name: full
        description: "Every live line fully received"

  - name: PurchaseInvoiceStatus
    description: "Billing maturity (pure stored compute from the billed watermarks — never hand-set)"
    variants:
      - name: no
        description: "Nothing to invoice / not in the operational state"
        default: true
      - name: to_invoice
        description: "Invoiceable quantity remains on at least one live line"
      - name: invoiced
        description: "Every live line fully billed"

  - name: QtyReceivedMethod
    description: "How a PO line's received_qty advances: seam allocation (stock_moves) or operator entry (manual)"
    variants:
      - name: stock_moves
        description: "The receipt seam allocates received_qty (default)"
        default: true
      - name: manual
        description: "An operator sets received_qty via set_manual_line_receipt; seam allocation skips the line"

  - name: PurchaseMethod
    description: "Billing capacity formula for a PO line (invoice ≤ receipt vs invoice ≤ ordered)"
    variants:
      - name: on_received
        description: "billed_qty caps at received_qty — the goods default (3-way match)"
        default: true
      - name: purchase
        description: "billed_qty caps at quantity — order-driven service lines may bill ahead of receipt"

  - name: OrderKind
    description: "Standard purchase or subcontract subtype"
    variants:
      - name: standard
        description: "Ordinary goods/services purchase"
        default: true
      - name: subcontract
        description: "Service + supplied-material BOM (subcontracting folds in here, supply-chain §6.1)"

  - name: PurchaseDocStatus
    description: "Lifecycle for sourcing docs (material request / RFQ / supplier quotation)"
    variants:
      - name: draft
        description: "Being prepared"
        default: true
      - name: submitted
        description: "Issued / active"
      - name: ordered
        description: "Converted into a purchase order"
      - name: cancelled
        description: "Voided"

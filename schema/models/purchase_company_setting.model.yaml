# =============================================================================
# Domain: Buying
# Entity: PurchaseCompanySetting
# Description: Buying posture settings — the double-validation gate and the
# receipt-reminder switch. A single live settings row per scope (the composing
# service's tenancy decorator re-declares that singleton org-scoped, see the
# index note below); an ABSENT row means the runtime
# defaults (one_step / 5,000 / send reminders), which are exactly the behavior
# before this table existed — so rolling out without creating settings rows
# changes nothing.
# =============================================================================

models:
  - name: PurchaseCompanySetting
    collection: purchase_company_settings
    description: "Buying posture settings (double-validation gate + receipt reminders); absent row = runtime defaults"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique settings row identifier"

      double_validation:
        type: DoubleValidation
        attributes: ["@default(one_step)"]
        description: "Purchase double-validation posture: one_step confirms every PO straight into purchase; two_step parks over-threshold POs in to_approve until a manager approves"

      double_validation_amount:
        type: decimal
        attributes: ["@default(5000)", "@precision(18,2)", "@non_negative"]
        description: "Double-validation threshold, DENOMINATED IN HOME CURRENCY — a PO is over-threshold when total * currency_rate >= this amount (currency_rate is the order-time snapshot converting the PO total INTO home currency)"

      company_currency:
        type: string
        attributes: ["@default(\"IDR\")", "@max(3)"]
        description: "The home ISO currency code — the denomination of the double-validation threshold; a PO in a different currency must carry a currency_rate"

      send_reminder:
        type: bool
        attributes: ["@default(true)"]
        description: "Master switch for the receipt-reminder cron: when false (or the settings row is absent), the cron silently skips"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    indexes:
      # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The former
      # one-row-per-company unique is re-declared org-scoped (org_unit_id) by the
      # composing service's tenancy decorator — module-side the table is a plain
      # settings table and an absent row means the schema defaults.

# =============================================================================
# Enums
# =============================================================================

enums:
  - name: DoubleValidation
    description: "Purchase double-validation posture"
    variants:
      - name: one_step
        description: "No second approval step: confirm always lands in purchase"
        default: true
      - name: two_step
        description: "Over-threshold POs park in to_approve until a manager approves"

# =============================================================================
# buying Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Module schema index. `module:` and `schema:` are stamped from the
# module name by `metaphor module create`. `schema:` gives this module its OWN
# Postgres schema (migrations emit `CREATE SCHEMA buying` and qualify tables
# as `buying.<table>`) — the convention every backbone module follows
# (see backbone-sapiens, backbone-bucket). Do not remove it.
# =============================================================================

module: buying
version: 2
schema: buying

# -----------------------------------------------------------------------------
# Tenancy: none, by design (ADR-0029). The module is tenant-agnostic and
# reusable — it ships no scoping column and no fence declaration. A composing
# backend-service that wants these tables org-scoped declares them in its
# tenancy.yaml; the decorator installs org_unit_id, the RLS policy, and the
# org-scoped per-unit indexes (the supplier/status listing indexes, the
# settings and price uniques) at composition time.
#
# Singleton note: purchase_company_settings formerly carried one row per
# company (a company-leading unique). After the strip the module treats it as
# a plain settings table; a composing service re-declares that uniqueness
# org-scoped (org_unit_id) in its tenancy.yaml.
# -----------------------------------------------------------------------------

description: "Buying: Material Request -> RFQ -> Supplier Quotation -> Purchase Order. Procure-to-pay intent; drives inventory Purchase Receipt (asset post) via ReceiptExpected and billing Purchase Invoice (A/P). Emits no AccountingPost."

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# Import each entity model. Replace `example` with your real entities.
imports:
  - material_request.model.yaml
  - rfq.model.yaml
  - supplier_quotation.model.yaml
  - purchase_order.model.yaml
  - purchase_company_setting.model.yaml
  - supplier_reminder_setting.model.yaml
  - purchase_agreement.model.yaml
  - supplier_price.model.yaml

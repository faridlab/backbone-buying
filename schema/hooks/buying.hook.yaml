# =============================================================================
# buying Hooks — PO lifecycle + write-path rules (spec of behavior in
# src/application/service/buying_write_service.rs + siblings, proven in tests/).
#
# The PurchaseOrder status is HAND-SET (ADR-0016): every transition is a write
# by a lifecycle verb, never derived. Delivery/billing maturity left the status
# band — receipt_status / invoice_status are stored-compute PROJECTIONS of the
# line watermarks (recomputed after every allocation, never hand-written).
# =============================================================================

module: buying
version: 2

state_machines:
  - entity: MaterialRequest
    field: status
    verbs: hand
    lifecycle: hand_set
    initial: draft
    states: [draft, submitted, ordered, cancelled]
    transitions:
      - { from: draft, to: submitted, on: submit }
      # issuing an RFQ from the request marks it ordered, submitted or not
      - { from: draft,     to: ordered, on: issue_rfq }
      - { from: submitted, to: ordered, on: issue_rfq }
  - entity: SupplierQuotation
    field: status
    verbs: hand
    lifecycle: hand_set
    initial: draft
    states: [draft, submitted, ordered, cancelled]
    transitions:
      - { from: submitted, to: ordered, on: convert_to_po }

  # The 5-state band: draft / sent / to_approve / purchase / cancelled. No
  # done/completed/closed states — full receipt and full billing live on the
  # receipt_status / invoice_status projections below.
  - entity: PurchaseOrder
    field: status
    verbs: hand
    lifecycle: hand_set
    description: >
      Hand-set per ADR-0016: transitions are writes by the lifecycle verbs,
      never derived. confirm enters purchase directly when the
      double-validation gate passes (or the caller claims the manager leg);
      an over-threshold two-step confirm parks in to_approve instead.
      PurchaseOrderConfirmed is published from BOTH entry paths exactly once.
      date_approve is stamped on entering purchase and deliberately survives
      reset (it records that an approval once happened).
    initial: draft
    states: [draft, sent, to_approve, purchase, cancelled]
    transitions:
      - { from: draft,     to: sent,       on: send }         # printed/sent to supplier
      - { from: draft,     to: to_approve, on: confirm }      # gate refused (two_step, over threshold, no manager)
      - { from: sent,      to: to_approve, on: confirm }
      - { from: draft,     to: purchase,   on: confirm }      # gate passed / manager claim
      - { from: sent,      to: purchase,   on: confirm }
      - { from: to_approve, to: purchase,  on: approve }      # manager leg — same event as confirm's entry
      - { from: sent,      to: draft,      on: reset }
      - { from: to_approve, to: draft,     on: reset }
      - { from: purchase,  to: draft,      on: reset }
      - { from: cancelled, to: draft,      on: reset }
      - { from: draft,     to: cancelled,  on: cancel }       # G4/G5 guarded
      - { from: sent,      to: cancelled,  on: cancel }
      - { from: to_approve, to: cancelled, on: cancel }
      - { from: purchase,  to: cancelled,  on: cancel }

  # Stored-compute projections (ADR-0016 `projection`): recomputed by
  # recompute_order_maturity after every watermark allocation; write-proof
  # everywhere else (kept out of Create/Update/Patch DTOs; update_maturity is
  # guarded to status='purchase').
  - entity: PurchaseOrder
    field: receipt_status
    verbs: hand
    lifecycle: projection
    description: >
      Projection of the line received watermarks: full iff every live line
      received its ordered quantity; partial iff any live line received
      anything; else pending. Recomputed after every receipt/return.
    initial: pending
    states: [pending, partial, full]
    # no hand-set transitions: recompute_order_maturity rewrites the projection
    # after every receipt or return, so it can land on any value from any other
    transitions:
      - { from: pending, to: partial, on: recompute }
      - { from: pending, to: full,    on: recompute }
      - { from: partial, to: full,    on: recompute }
      - { from: partial, to: pending, on: recompute }   # a return takes back every receipt
      - { from: full,    to: partial, on: recompute }   # a return reopens a line
      - { from: full,    to: pending, on: recompute }
  - entity: PurchaseOrder
    field: invoice_status
    verbs: hand
    lifecycle: projection
    description: >
      Projection of the line billing watermarks under the two-formula capacity
      (received_qty for on_received lines, quantity for purchase-method lines):
      to_invoice iff any live line still has billable quantity remaining
      (a received-but-never-billed PO IS to invoice); else invoiced iff
      anything was billed; else no.
    initial: "no"
    states: [no, to_invoice, invoiced]
    # no hand-set transitions: recompute_order_maturity rewrites the projection
    # after every receipt, return, bill or credit, so it can land on any value from any other
    transitions:
      - { from: "no",       to: to_invoice, on: recompute }
      - { from: "no",       to: invoiced,   on: recompute }   # one bill covers every billable line
      - { from: to_invoice, to: invoiced,   on: recompute }
      - { from: to_invoice, to: "no",       on: recompute }   # a return removes the only billable receipt
      - { from: invoiced,   to: to_invoice, on: recompute }   # a credit or a new receipt reopens billing
      - { from: invoiced,   to: "no",       on: recompute }   # a credit reverses the only bill

  # Inert flags: no machine, no transition — written once by their verb.
  # locked: set/cleared by lock/unlock; its only effect is the G4 cancel guard.
  # acknowledged: stamped by the acknowledge verb (and by a receipt landing);
  #   its only effect is suppressing the receipt reminder.
  # qty_received_method / purchase_method (line): tier picks written at create.

  - entity: PurchaseAgreement
    field: status
    verbs: hand
    lifecycle: hand_set
    description: >
      Hand-set per ADR-0016. Confirming a draft blanket mints its supplier
      prices (the ONLY writer of buying.supplier_prices — PXB-1); close/cancel
      unlink them and refuse while a pre-confirmed call-off PO hangs off the
      agreement.
    initial: draft
    states: [draft, open, done, cancelled]
    transitions:
      - { from: draft, to: open,      on: confirm }
      - { from: open,  to: done,      on: close }
      - { from: draft, to: cancelled, on: cancel }
      - { from: open,  to: cancelled, on: cancel }

rules:
  - id: R1
    name: non_empty_document
    entity: PurchaseOrder
    when: create
    enforced_by: "src/application/service/buying_write_service.rs::price_document"
    assert: "count(lines) >= 1"
    error_code: empty_document
    enforcement: service
    justification: "The header and its lines commit in ONE transaction; a SQL expression would need a deferred cross-table constraint to see the lines at insert time."
  - id: R2
    name: non_negative
    entity: PurchaseOrderItem
    when: create
    assert: "line.quantity >= 0 AND line.rate >= 0"
    error_code: negative_quantity
    enforcement: db
    enforced_by: "src/application/service/buying_write_service.rs::price_document"
    justification: "The priced create paths refuse with negative_quantity. Every other writer, the RFQ-to-quotation conversion among them, meets only the unnamed column CHECKs (quantity >= 0, rate >= 0) on the order and supplier-quotation lines, which refuse without the typed code."
  - id: R3
    name: unique_number
    entity: PurchaseOrder
    when: create
    assert: "document number is unique (partial unique index where deleted_at is null)"
    error_code: duplicate_number
    enforcement: db
    enforced_by: "migrations/20260426220003_create_purchase_order_table.up.sql::idx_purchase_orders_po_number, migrations/20260426220001_create_material_request_table.up.sql::idx_material_requests_request_number, migrations/20260426220005_create_request_for_quotation_table.up.sql::idx_request_for_quotations_rfq_number, migrations/20260426220008_create_supplier_quotation_table.up.sql::idx_supplier_quotations_quotation_number, migrations/20260722000001_create_purchase_agreement_table.up.sql::idx_purchase_agreements_agreement_number"
  - id: R4
    name: confirmable
    entity: PurchaseOrder
    when: confirm
    assert: "purchase order is draft or sent"
    error_code: not_confirmable
    enforcement: both
    enforced_by: "src/application/service/buying_order_lifecycle.rs::confirm_purchase_order, src/infrastructure/persistence/purchase_order_repository.rs::enter_purchase, src/infrastructure/persistence/purchase_order_repository.rs::park_for_approval"
  - id: R5
    name: three_way_match
    entity: PurchaseOrderItem
    when: allocate
    assert: "received_qty <= quantity AND billed_qty <= CASE WHEN purchase_method='purchase' THEN quantity ELSE received_qty END (one formula, three surfaces: DB CHECK, allocation cap, maturity recompute)"
    error_code: over_receipt / over_billing
    enforcement: both
    enforced_by: "migrations/20260827100000_po_five_state_band.up.sql::po_items_three_way_match, src/application/service/buying_receipt.rs::allocate, src/application/service/buying_bill_matching.rs::match_bill_lines"
  - id: R5-gate
    name: double_validation_threshold
    entity: PurchaseOrder
    when: confirm
    assert: "in two_step, total * currency_rate >= double_validation_amount requires the manager leg; the threshold is denominated in the home currency (the settings row's company_currency) and the total is converted INTO home currency with the order-time rate snapshot (never reverse-divided, never a silent rate of 1)"
    error_code: not_approvable
    enforcement: service
    enforced_by: "src/application/service/buying_order_lifecycle.rs::confirm_purchase_order, src/application/service/buying_order_lifecycle.rs::approve_purchase_order, src/presentation/http/guarded_routes.rs::confirm_po, src/presentation/http/guarded_routes.rs::approve_po"
    justification: "The gate is procedural multi-currency math (a settings read joined with the PO's order-time rate snapshot), not a row-level CHECK. This module has no role model: who holds the manager leg is the composing service's decision, which it states by inserting the PurchaseManager extension on the confirm and approve requests; nothing in the request body can claim it. The column default currency_rate = 1 still lets a write that skips the validated create carry a silent rate of 1."
  # -- cancel/delete guards (service pre-check; trigger is the backstop) -------------
  - id: G4
    name: po_cancel_locked
    entity: PurchaseOrder
    when: cancel
    assert: "a locked purchase order refuses cancel"
    error_code: order_locked
    enforcement: both
    enforced_by: "src/application/service/buying_order_lifecycle.rs::cancel_purchase_order"
    justification: "The cancel verb refuses. The po_write_guards trigger is no backstop yet: it tests NEW.locked, so one UPDATE that unlocks and cancels together passes it."
  - id: G5
    name: po_cancel_billed
    entity: PurchaseOrder
    when: cancel
    assert: "cancel refuses while any live line has billed_qty > 0"
    error_code: order_billed
    enforcement: both
    enforced_by: "src/application/service/buying_order_lifecycle.rs::cancel_purchase_order, migrations/20260827100000_po_five_state_band.up.sql::po_write_guards"
  - id: G6
    name: match_requires_lines
    entity: PurchaseOrder
    when: match_bill_lines
    assert: "an empty proposal list refuses instead of no-op matching"
    error_code: no_lines_selected
    enforcement: service
    enforced_by: "src/application/service/buying_bill_matching.rs::match_bill_lines"
    justification: "The rule is about the REQUEST, not about stored rows: it refuses a call that proposes nothing. An empty proposal writes nothing, so there is no row for a constraint to reject, and the point is to answer the caller rather than to leave the books unchanged in silence."
  - id: G8
    name: po_delete_requires_cancelled
    entity: PurchaseOrder
    when: delete
    assert: "a live purchase order is never deletable — soft-delete only from cancelled"
    error_code: not_deletable
    enforcement: both
    enforced_by: "src/application/service/buying_order_lifecycle.rs::delete_purchase_order, src/infrastructure/persistence/purchase_order_repository.rs::soft_delete_cancelled, migrations/20260827100000_po_five_state_band.up.sql::po_write_guards, migrations/20260827100000_po_five_state_band.up.sql::po_hard_delete_guard"
  - id: G9
    name: po_item_delete_requires_editable_order
    entity: PurchaseOrderItem
    when: delete line
    assert: "a line is deletable only while its parent order is draft/sent"
    error_code: not_deletable
    enforcement: both
    enforced_by: "src/application/service/buying_order_lifecycle.rs::delete_purchase_order_line, src/infrastructure/persistence/purchase_order_item_repository.rs::soft_delete_line, migrations/20260827100000_po_five_state_band.up.sql::po_item_write_guards"
  # -- agreement guards ---------------------------------------------------------------
  - id: PXB-1
    name: supplier_prices_agreement_owned
    entity: SupplierPrice
    when: write supplier_prices
    assert: "buying.supplier_prices has NO CRUD route and no standalone writer: only the agreement confirm (mint), open re-price (propagate), and close/cancel (unlink) write it"
    error_code: supplier_price_agreement_owned
    enforcement: both
    enforced_by: "migrations/20261017130000_supplier_prices_agreement_owned.up.sql::supplier_prices_agreement_owned"
    justification: "The agreement verbs mark their transaction (supplier_price_repository.rs mark_agreement_write) before they mint, re-price or unlink a price, and the trigger supplier_prices_agreement_owned refuses any insert, update or delete in a transaction without the mark, so a generic service, another module or raw SQL cannot write the table (tests/call_off_cap.rs supplier_prices_change_only_through_their_agreement). An update that changes only org_unit_id, the composing service's tenancy backfill, passes."
  - id: G-agreement-close
    name: agreement_close_no_draft_calloffs
    entity: PurchaseAgreement
    when: close, cancel agreement
    assert: "close/cancel refuses while a call-off PO in draft/sent/to_approve hangs off the agreement"
    error_code: agreement_has_draft_orders
    enforcement: service
    justification: "PARTLY: retire_agreement counts the open call-offs on the pool before its transaction opens, without a lock, so a call-off created between that count and the transition slips past. Cross-table: the guard reads the call-off orders hanging off the agreement, which no CHECK on the agreement row can see."
  - id: G-call-off-cap
    name: call_off_within_blanket
    entity: PurchaseAgreementLine
    when: create_call_off_po
    assert: "line.qty_ordered + call_off.quantity <= line.quantity (the blanket quantity caps the call-offs)"
    error_code: agreement_exceeded
    enforcement: service
    enforced_by: "src/infrastructure/persistence/purchase_agreement_line_repository.rs::increment_qty_ordered"
    justification: "increment_qty_ordered advances qty_ordered only WHERE qty_ordered + the draw <= quantity, in the call-off's transaction, and create_call_off_po refuses with agreement_exceeded when no row advanced; the condition is read and written in one statement, so concurrent call-offs and a call-off naming a line twice cannot pass the cap (tests/call_off_cap.rs). The earlier check in create_call_off_po only answers early. Cross-row aggregate: a CHECK on one row cannot see the sum the call-offs draw."
  - id: G7
    name: reminder_settings_gate
    entity: PurchaseCompanySetting
    when: send_receipt_reminder
    assert: "no settings row, or send_reminder=false, skips the run silently; a supplier override with receipt_reminder_email=false is excluded from the claim; an absent supplier row is the enabled default (remind, 1 day)"
    error_code: null
    enforcement: service
    enforced_by: "src/infrastructure/jobs/send_receipt_reminder.rs::send_receipt_reminder, src/infrastructure/jobs/send_receipt_reminder.rs::reminders_enabled"
    justification: "A skip is not a refusal. The rule decides whether a scheduled run does anything at all, by reading settings and per-supplier overrides before any write exists; there is no row to constrain, and a database guard would turn a deliberate quiet skip into an error."

events:
  PurchaseOrderConfirmed:
    when: "a purchase order enters purchase (gate-passing confirm OR manager approve — one event, two entry paths)"
    payload: [order_id, company_id, supplier_id, grand_total, currency, order_kind]
  PurchaseOrderPendingApproval:
    when: "the double-validation gate parked a confirm in to_approve"
    payload: [order_id, company_id]
  ReceiptRequested:
    when: "a purchase-state PO requests goods receipt"
    payload: [order_id, company_id, supplier_id, currency, order_kind, lines]
  PurchaseReceiptRecorded:
    when: "a receipt (seam allocation or manual line set) applied to a PO — every receipt, not only milestones"
    payload: [order_id, company_id, order_kind, lines]
  BillLinesMatched:
    when: "a manual bill match was accepted"
    payload: [order_id, company_id, matches]
  PurchaseReceiptReminderDue:
    when: "the reminder job claimed a due un-acknowledged PO (the notification port — buying has no mail stack)"
    payload: [order_id, company_id, supplier_id, schedule_date]
